# main 에 올라오면 Windows·Mac 설치 파일을 만들어 GitHub Release(v<package.json 버전>)로 올린다.
# 그 버전 Release 가 이미 있으면 빌드하지 않는다 → 버전을 올린 머지에서만 새 Release 가 생긴다.
# Actions 탭의 "Run workflow" 로 손으로 돌려도 된다.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v$(node -p "require('./package.json').version")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; echo "$tag Release 가 이미 있어 건너뜀"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  win:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Bimo-win
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  mac:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # 빌드 서버는 Apple 실리콘이라 인텔용 터미널 모듈은 따로 받아 둔다
      - run: npm install --no-save --force @lydell/node-pty-darwin-x64@1.2.0-beta.15
      - run: npm run dist:mac
      # 만든 앱을 실제로 띄워 터미널(zsh)에서 echo 결과가 나오는지 본다
      - name: Smoke test
        env:
          SMOKE_MS: '6000'
          BIMO_USER_DATA: ${{ runner.temp }}/pb-data
          SMOKE_JS: >-
            (async()=>{await new Promise(r=>setTimeout(r,4000)); const n=[...nodes.values()][0]; const b=n.term.buffer.active; const lines=[]; for(let i=0;i<b.length;i++) lines.push(b.getLine(i).translateToString(true).trim()); return JSON.stringify({ok: lines.includes('smoke-ok'), lines: lines.filter(Boolean).slice(-6)})})()
        run: |
          out=$(release/mac-arm64/Bimo.app/Contents/MacOS/Bimo --smoke 2>&1 || true)
          echo "$out" | grep SMOKE_
          echo "$out" | grep -q '\\"ok\\":true'
      - uses: actions/upload-artifact@v4
        with:
          name: Bimo-mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  release:
    needs: [version, win, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Bimo $TAG" --generate-notes
